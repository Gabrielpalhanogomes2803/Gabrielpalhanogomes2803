name: Update contribution graph

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/contributions.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contributions-light.svg?color_snake=%230891b2&color_dots=%23ebf4f7,%23b7e8ee,%2367cddc,%2322b6ca,%230891b2
            dist/contributions-dark.svg?palette=github-dark&color_snake=%2322d3ee&color_dots=%230d1117,%23164e63,%230e7490,%230891b2,%2322d3ee

      - name: Publish SVGs
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
